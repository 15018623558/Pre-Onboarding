<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>入职信息采集 - 催办</title>
  <style>
    :root {
      --f: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      --ink: #1a1a1a;
      --sub: #8a8f99;
      --line: #eef0f3;
      --link: #3b7cff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--f);
      background: #E8EDF4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px 60px;
      color: var(--ink);
    }
    .proto-hd { text-align: center; margin-bottom: 30px; }
    .proto-hd h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .proto-hd p { font-size: 13px; color: #64748B; margin-top: 6px; }

    /* ===== iPhone 外壳 ===== */
    .iph {
      width: 393px; height: 852px; border-radius: 48px;
      border: 3px solid #1E293B; outline: 5px solid #0F172A;
      box-shadow: 0 25px 60px rgba(0,0,0,.3);
      background: #fff; position: relative; overflow: hidden;
    }
    .iph::before {
      content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 126px; height: 34px; background: #0F172A; border-radius: 0 0 18px 18px; z-index: 90;
    }

    /* ===== 状态栏 ===== */
    .sbar {
      height: 54px; display: flex; align-items: flex-end; justify-content: space-between;
      padding: 0 26px 8px; background: #fff;
    }
    .sbar .tm { font-size: 15px; font-weight: 600; letter-spacing: .3px; }
    .sbar .rgt { display: flex; align-items: center; gap: 6px; }
    .sbar .net { font-size: 11px; font-weight: 600; letter-spacing: .5px; }
    .sbar .batt { display: flex; align-items: center; gap: 3px; }
    .sbar .batt .pct { font-size: 11px; font-weight: 600; }

    /* ===== 顶部导航 ===== */
    .topnav {
      height: 44px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; background: #fff;
    }
    .topnav .back { width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer; }
    .topnav .fold { display: flex; align-items: center; gap: 14px; }
    .topnav .fold span { width: 30px; height: 30px; display: grid; place-items: center; cursor: pointer; color: #3c414d; }

    /* ===== 邮件主体滚动区 ===== */
    .mail-scroll {
      height: calc(100% - 54px - 44px - 62px - 34px);
      overflow-y: auto; padding: 6px 18px 24px; background: #fff;
    }

    /* 标题 */
    .mail-title {
      font-size: 20px; font-weight: 700; line-height: 1.45;
      letter-spacing: .2px; padding: 4px 0 18px;
    }

    /* 发件人区块 */
    .sender-block { padding-bottom: 14px; }
    .sender-row { display: flex; align-items: flex-start; gap: 11px; }
    .avatar {
      width: 40px; height: 40px; min-width: 40px; border-radius: 50%;
      background: linear-gradient(135deg, #f97360, #e8503c);
      color: #fff; font-size: 15px; font-weight: 600;
      display: grid; place-items: center; margin-top: 2px;
    }
    .sender-meta { flex: 1; min-width: 0; }
    .sender-line1 { display: flex; align-items: baseline; gap: 8px; }
    .sender-name { font-size: 15px; font-weight: 600; }
    .sender-mail { font-size: 12.5px; color: var(--sub); }
    .sender-line2 { font-size: 12.5px; color: var(--sub); margin-top: 2px; }
    .hide-btn {
      font-size: 13px; color: #4a5060; background: #f2f4f7;
      border-radius: 14px; padding: 4px 13px; white-space: nowrap;
      align-self: flex-start; margin-top: 4px; cursor: pointer;
    }
    .recv-line { font-size: 12.5px; color: var(--sub); margin-top: 9px; padding-left: 51px; }
    .recv-line b { color: #5a6170; font-weight: 500; }
    .time-line { font-size: 12.5px; color: var(--sub); margin-top: 5px; padding-left: 51px; }

    .divider { height: 1px; background: var(--line); margin: 4px 0 20px; }

    /* 正文 */
    .mail-body { font-size: 15px; line-height: 1.9; color: #2b2f38; }
    .mail-body .salut { margin-bottom: 14px; }
    .mail-body a { color: var(--link); text-decoration: underline; text-underline-offset: 3px; }

    /* ===== 底部操作栏 ===== */
    .actionbar {
      height: 62px; display: flex; align-items: center; justify-content: space-around;
      border-top: 1px solid var(--line); background: #fff; padding-bottom: 4px;
    }
    .act {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      color: #4a5060; font-size: 10.5px; cursor: pointer; transition: color .15s;
    }
    .act:active { color: var(--link); }

    /* Home 指示条 */
    .homebar {
      height: 34px; display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 9px; background: #fff;
    }
    .homebar i { width: 134px; height: 5px; border-radius: 3px; background: #0F172A; }
  </style>
</head>
<body>

  <div class="proto-hd">
    <h1>入职信息采集 - 催办</h1>
    <p>邮件通知 · 信息采集催办</p>
  </div>

  <div class="iph">
    <!-- 状态栏 -->
    <div class="sbar">
      <span class="tm">18:13</span>
      <div class="rgt">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="none"><rect x="0" y="6" width="3" height="5" rx="1" fill="#1a1a1a"/><rect x="4.5" y="4" width="3" height="7" rx="1" fill="#1a1a1a"/><rect x="9" y="2" width="3" height="9" rx="1" fill="#1a1a1a"/><rect x="13.5" y="0" width="3" height="11" rx="1" fill="#c6cad2"/></svg>
        <span class="net">5G</span>
        <span class="net" style="color:#8a8f99;">4G</span>
        <div class="batt">
          <span class="pct">88%</span>
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="#1a1a1a" stroke-opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="2" fill="#1a1a1a"/><path d="M23 4v4a2 2 0 000-4z" fill="#1a1a1a" fill-opacity=".4"/></svg>
        </div>
      </div>
    </div>

    <!-- 顶部导航 -->
    <div class="topnav">
      <span class="back">
        <svg width="12" height="20" viewBox="0 0 12 20" fill="none"><path d="M10.5 1.5L2 10l8.5 8.5" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <div class="fold">
        <span>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 11.5l5-5 5 5" stroke="#3c414d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 6.5l5 5 5-5" stroke="#3c414d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </div>
    </div>

    <!-- 邮件内容 -->
    <div class="mail-scroll">
      <div class="mail-title">福建纵腾网络有限公司入职前信息采集催办通知</div>

      <div class="sender-block">
        <div class="sender-row">
          <div class="avatar">纵腾</div>
          <div class="sender-meta">
            <div class="sender-line1">
              <span class="sender-name">纵腾</span>
              <span class="sender-mail">corehr@shmail.ibeisen.com</span>
            </div>
            <div class="sender-line2">（由 post@shmail.ibeisen.com 代发）</div>
          </div>
          <span class="hide-btn">隐藏</span>
        </div>
        <div class="recv-line">收件人：<b>刘观福</b> &lt;1079028588@qq.com&gt;</div>
        <div class="time-line">2026年6月10日 08:24</div>
      </div>

      <div class="divider"></div>

      <div class="mail-body">
        <div class="salut">尊敬的刘观福：</div>
        <div>欢迎您加入福建纵腾网络有限公司，您的入职信息采集还没有提交，请尽快填写并提交。<a href="javascript:;">点击进入</a></div>
      </div>
    </div>

    <!-- 底部操作栏 -->
    <div class="actionbar">
      <div class="act">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 6h14M9 6V4.5A1.5 1.5 0 0110.5 3h1A1.5 1.5 0 0113 4.5V6M6 6l.8 11.2A2 2 0 008.8 19h4.4a2 2 0 002-1.8L16 6M9.3 9.5l.4 6M12.7 9.5l-.4 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        删除
      </div>
      <div class="act">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M11 14V4M11 4L7 8M11 4l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 12.5v4A1.5 1.5 0 006 18h10a1.5 1.5 0 001.5-1.5v-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        分享
      </div>
      <div class="act">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M9 5L4.5 9.5 9 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 9.5H13a4.5 4.5 0 014.5 4.5v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        回复转发
      </div>
      <div class="act">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="5" cy="11" r="1.7" fill="currentColor"/><circle cx="11" cy="11" r="1.7" fill="currentColor"/><circle cx="17" cy="11" r="1.7" fill="currentColor"/></svg>
        更多
      </div>
    </div>

    <!-- Home 指示条 -->
    <div class="homebar"><i></i></div>
  </div>

</body>
</html>
